name: APK Olustur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Android klasorunu olustur
        run: |
          flutter create . --platforms=android --org com.sansar --project-name gunun_sorusu
          rm -f test/widget_test.dart

      - name: Paketleri indir
        run: flutter pub get

      - name: APK derle
        run: flutter build apk --release

      - name: APK Yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
